<!doctype html>
<html lang="en">
<head>

<meta name="theme-color" content="#2f6b3a">
<title>The Unfinished Tutorial</title>
<meta name="description" content="A tiny real MMO. Everyone is stuck in the tutorial because the rest of the game never shipped.">
<style>

  #log b { font-weight:700; }
  #bar { position:fixed; left:10px; right:10px; bottom:max(10px,env(safe-area-inset-bottom)); display:flex; gap:8px; }

  button:active { transform:translateY(2px); box-shadow:none; }
  #chatbox { display:none; flex:1; gap:8px; }
  #chatbox.open { display:flex; }
  #chatbox input { flex:1; min-width:0; height:46px; border-radius:12px; border:0; padding:0 12px; font:inherit; font-size:16px; }
  #toast { position:fixed; left:50%; top:30%; transform:translate(-50%,-50%); text-align:center; font-weight:800; font-size:22px; text-shadow:0 2px 0 #000,0 0 12px rgba(0,0,0,.6); pointer-events:none; opacity:0; transition:opacity .3s; width:min(90%,520px); }

  #mebtn.pulse { animation:pulse 1s infinite; } @keyframes pulse { 50% { background:#ffd34d; } }
  #bag .dot { position:absolute; top:6px; right:6px; width:10px; height:10px; border-radius:50%; background:#ff5c5c; display:none; }
  #bag.new .dot { display:block; }
  #bagp { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); width:min(94vw,520px); max-height:82vh; overflow:auto; background:var(--paper); color:var(--ink); border-radius:16px; padding:14px; box-shadow:0 8px 30px rgba(0,0,0,.5); display:none; }

  #bagp h2 { margin:0 0 2px; font-size:18px; }
  #bagp .sub { font-size:13px; opacity:.7; margin-bottom:10px; }
  #bagp .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:8px; }
  #bagp .it { border:2px solid #e3dcc4; border-radius:12px; padding:6px; text-align:center; font-size:12px; line-height:1.25; cursor:pointer; background:#fff; }
  #bagp .it.on { border-color:#1b1f17; background:#fff6c9; }
  #bagp .it.no { opacity:.45; cursor:default; }

  #combo b { display:block; font-size:clamp(30px,10vw,44px); line-height:1.1; color:#ffd34d; transform-origin:right center; padding-right:4px; }
  #combo small { display:block; font-size:13px; font-weight:700; color:#fff; max-width:150px; margin-left:auto; }
  #mep { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); width:min(94vw,520px); max-height:86vh; overflow:auto; background:var(--paper); color:var(--ink); border-radius:16px; padding:14px; box-shadow:0 8px 30px rgba(0,0,0,.5); display:none; }

  #mep .opt.on { border-color:#1b1f17; background:#fff6c9; }
  #mep .opt.locked { opacity:.45; }
  #mep .sw { width:34px; height:34px; padding:0; border-radius:50%; border:3px solid #fff; box-shadow:0 0 0 2px #e3dcc4; }
  #mep .sw.on { box-shadow:0 0 0 3px #1b1f17; }
  #mep .stats { font-size:13px; opacity:.75; margin-top:4px; }
  #mep .close { position:sticky; top:0; float:right; height:36px; padding:0 12px; }
  #status { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(20,26,18,.85); font-size:18px; text-align:center; padding:20px; }
  #status.hide { display:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="me" class="hud">
  <div class="name" id="nm" title="Tap to change your name">…</div>
  <div id="lv">Lv 1</div>
  <div class="bar" id="hp"><i></i></div>
  <div class="bar" id="xp"><i></i></div>
</div>
<div id="world" class="hud"><div><b id="on">0</b> online</div><div><b id="tot">0</b> slimes killed by everyone</div><div id="a2" style="display:none;color:#ff7bf0;font-weight:800"></div><div id="pt">Next patch</div><div class="bar" id="pb"><i></i></div></div>
<div id="log"></div>

  <button id="say">💬 Chat</button>

  <button id="bag">🎒 Bag<span class="dot"></span></button>

</div>
<div id="toast"></div>
<div id="combo"><b></b><small></small></div>
<div id="mep"><button class="close" id="mex">Done</button><h2>Character maker</h2>
  <div class="top"><canvas id="prev" width="240" height="240"></canvas><div style="flex:1;min-width:0"><input id="mename" maxlength="16" placeholder="Your name" autocomplete="off"><div class="stats" id="mestats"></div></div></div>
  <h3>Color</h3><div class="row" id="mecol"></div>
  <h3>Body</h3><div class="row" id="meshape"></div>
  <h3>Eyes</h3><div class="row" id="meeyes"></div>
  <h3>Mouth</h3><div class="row" id="memouth"></div>
  <h3>Title</h3><div class="row" id="metitle"></div>
  <h3>Other</h3><div class="row"><button class="opt" id="merand">🎲 Randomize</button><button class="opt" id="mesnd"></button></div>
</div>
<div id="bagp"><button class="close" id="bagx">Close</button><h2>Bag</h2><div class="sub" id="bagsub"></div><div class="grid" id="baggrid"></div></div>
<div id="status">Connecting to the only server…</div>
<script type="module">
import { ITEMS, RARITY, PATCHES, SHAPES, EYES, MOUTHS, TITLES } from './items.js';
{
const cv = document.getElementById('c'), cx = cv.getContext('2d');
const $ = (id) => document.getElementById(id);
let W = 1600, H = 1200, DPR = 1, vw = 0, vh = 0;
function resize() { DPR = Math.min(2, window.devicePixelRatio || 1); vw = innerWidth; vh = innerHeight; cv.width = vw * DPR; cv.height = vh * DPR; }
addEventListener('resize', resize); resize();

// ---------- the world's fixed stuff (same for everyone) ----------
const SPAWN = { x: 800, y: 600 };
const GUY = { x: 800, y: 520 };
const GUY_LINES = [
  "Hi! I'm the tutorial.",
  "Press W to walk forward.",
  "Oh, you're on a phone? Just tap. Nobody updated me.",
  "Tap a slime to fight it. Everyone who hits it gets the XP.",

  "I was supposed to give you a sword. Budget.",
  "That fence to Area 2 has HP. I'm not supposed to tell you that.",
  "Slimes drop loot now. The devs called it a content update.",
  "Tap Bag to wear your loot. Every item has the same stats: none.",
  "Keep hitting without stopping for a combo. Every 5th hit is a crit. That part works.",
  "Tap Me to make your character. The character creator was the one thing they finished.",
];
const SIGNS = [
  { x: 960, y: 600, title: "SHOP", text: "Closed for launch." },
  { x: 650, y: 650, title: "RESPAWN POINT", text: "Also the only point. Slimes can't come in here. They respect the tutorial." },
  { x: 1470, y: 690, title: "AREA 2 →", text: "Coming soon. The fence has HP, though. Tap it. Bring friends." },
  { x: 1700, y: 560, title: "AREA 2", text: "You made it. This is everything they built." },
  { x: 2330, y: 560, title: "AREA 3 →", text: "Coming soon. For real this time." },
  { x: 2000, y: 1000, title: "ROCK (PLACEHOLDER)", text: "Every rock out here is a grey box. Art is 'in progress'." },
  { x: 1180, y: 920, title: "QUEST BOARD", text: "Kill slimes. Reward: you killed slimes." },
  { x: 430, y: 470, title: "HOUSE", text: "It's only the front. Like most of the game." },
  { x: 260, y: 960, title: "TREE", text: "Cardboard. Don't look behind it." },
  { x: 800, y: 1120, title: "WORLD EDGE", text: "The map ends here. Pretend there's fog." },
];
function rng(seed) { return () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }; }
const R = rng(7), FLOWERS = [], BUSHES = [];
for (let i = 0; i < 140; i++) FLOWERS.push({ x: R() * W, y: R() * H, c: ['#ffe57a', '#ff9bd2', '#ffffff', '#9fd3ff'][Math.floor(R() * 4)] });
for (let i = 0; i < 26; i++) { const x = 60 + R() * (W - 120), y = 60 + R() * (H - 120); if (Math.hypot(x - SPAWN.x, y - SPAWN.y) > 160) BUSHES.push({ x, y, r: 14 + R() * 12 }); }
const SLIME_NAMES = ["SLIME_FINAL", "SLIME_FINAL_v2", "SLIME_FINAL_v2_ACTUAL", "slime (placeholder)", "slime_copy(3)", "SLIME_DO_NOT_SHIP"];
const BOSS = 99, TODO = 98, FENCE_X = 1560;
const ROCKS = [[1760, 320, 40], [1980, 760, 56], [2210, 420, 34], [1850, 1040, 30], [2280, 900, 44], [2080, 200, 28]];
let fence = [150, 150, 0], fenceShake = 0;

// ---------- state ----------
let ws = null, myId = null, snapA = null, snapB = null, snapAt = 0;
const fx = [], bubbles = new Map(), swings = new Map(), hurt = new Map();
let patch = 0;
let tapMark = null, guyLine = 0, guyAt = 0, total = 0;
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
let myName = store.get('ut_name'), myHue = Number(store.get('ut_hue'));
if (!Number.isFinite(myHue) || store.get('ut_hue') === null) { myHue = Math.floor(Math.random() * 360); store.set('ut_hue', myHue); }
if (!myName) { const a = ["Beta", "Unpaid", "Early", "Patch", "Lag", "Alpha", "Loading", "Demo"], b = ["Hero", "Tester", "Knight", "Guy", "Bean", "Legend", "Intern", "Wizard"]; myName = a[Math.floor(Math.random() * a.length)] + b[Math.floor(Math.random() * b.length)] + Math.floor(Math.random() * 90 + 10); store.set('ut_name', myName); }

function connect() {
  $('status').classList.remove('hide'); $('status').textContent = 'Connecting to the only server…';
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.onopen = () => { sendHi(); sendWear(); };
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.t === 'you') { myId = m.id; W = m.w; H = m.h; total = m.total; $('status').classList.add('hide'); }
    else if (m.t === 'full') { $('status').textContent = 'The server is full. An MMO with a queue. Very authentic. Try again soon.'; }
    else if (m.t === 's') onSnap(m);
    else if (m.t === 'loot') onLoot(m.item, m.x, m.y);
  };
  ws.onclose = () => { myId = null; $('status').classList.remove('hide'); $('status').textContent = 'Lost the server. Reconnecting…'; setTimeout(connect, 2000); };
}
function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

function toMap(arr, keys) { const out = new Map(); for (const a of arr) { const o = {}; keys.forEach((k, i) => o[k] = a[i]); out.set(o.id, o); } return out; }
const PK = ['id', 'x', 'y', 'hp', 'max', 'lvl', 'dead', 'name', 'hue', 'xp', 'need', 'kills', 'hat', 'hand', 'look'], MK = ['id', 'x', 'y', 'hp', 'max', 'kind'];
function onSnap(m) {
  snapA = snapB || { p: new Map(), m: new Map() };
  snapB = { p: toMap(m.p, PK), m: toMap(m.m, MK) };
  snapAt = performance.now();
  total = m.total;
  if (m.fz) { const was = fence[2]; fence = m.fz; $('a2').style.display = fence[2] ? '' : 'none'; if (fence[2]) $('a2').textContent = `AREA 2 OPEN: ${Math.floor(fence[2] / 60)}:${String(fence[2] % 60).padStart(2, '0')}`; }
  if (m.pa) { patch = m.pa[0]; $('pt').textContent = `Next patch 0.0.${patch + 1}: ${m.pa[1]}/${m.pa[2]} kills`; $('pb').firstChild.style.width = (100 * m.pa[1] / m.pa[2]) + '%'; }
  $('on').textContent = m.n; $('tot').textContent = total.toLocaleString();
  for (const e of m.e) onEvent(e);
  const me = snapB.p.get(myId);
  if (me) {
    $('nm').innerHTML = ''; $('nm').append(me.name + ' '); const sm = document.createElement('small'); sm.textContent = '✎'; $('nm').append(sm);
    $('lv').textContent = me.lvl >= 5 ? `Lv 5 (max) · ${me.kills} kills` : `Lv ${me.lvl} · ${me.kills} kills`;
    $('hp').firstChild.style.width = (100 * me.hp / me.max) + '%';
    $('xp').firstChild.style.width = me.lvl >= 5 ? '100%' : (100 * me.xp / me.need) + '%';
  }
}
function nameOf(id) { const p = snapB && snapB.p.get(id); return p ? p.name : 'someone'; }
function onEvent(e) {
  const now = performance.now();
  if (e.e === 'sys') log(e.text, true);
  else if (e.e === 'say') { bubbles.set(e.id, { text: e.text, until: now + 6000 }); log(null, false, nameOf(e.id), e.text); }
  else if (e.e === 'hit') {
    swings.set(e.by, now); slimeHit.set(e.id, now);
    const s = snapB.m.get(e.id) || (snapA && snapA.m.get(e.id)), mine = e.by === myId;
    if (s) {
      fx.push({ x: s.x + (Math.random() - .5) * 18, y: s.y - 22, text: (e.crit ? 'CRIT ' : '') + '-' + e.dmg, c: e.crit ? '#ff9a3d' : mine ? '#fff' : '#ffe08a', t: now, life: e.crit ? 900 : 700, big: e.crit ? 1.6 : mine ? 1.15 : 0.9 });
      const n = e.crit ? 10 : 5; for (let i = 0; i < n; i++) fx.push({ x: s.x, y: s.y, vx: (Math.random() - .5) * 220, vy: (Math.random() - .8) * 200, dot: true, sz: 3 + Math.random() * 3, c: s.kind === BOSS ? (i % 2 ? '#ff00dc' : '#111') : s.kind === TODO ? '#c8ccd2' : '#7be36a', t: now, life: 450 });
    }
    if (mine) { onMyHit(e); shake(e.crit ? 6 : 2.5); sfx(e.crit ? 'crit' : 'hit', e.combo); }
    else if (s && near(s)) sfx('hit', 0, 0.25);
  }
  else if (e.e === 'ow') { hurt.set(e.id, now); const p = snapB.p.get(e.id); if (p) fx.push({ x: p.x, y: p.y - 30, text: '-' + e.dmg, c: '#ff6b6b', t: now, life: 800, big: 1.2 }); if (e.id === myId) { shake(7); sfx('ow'); redFlash = now; } }
  else if (e.e === 'kill') {
    const mine = e.by && e.by.includes(myId);
    for (let i = 0; i < (e.boss ? 60 : 18); i++) fx.push({ x: e.x, y: e.y, vx: (Math.random() - .5) * (e.boss ? 520 : 320), vy: (Math.random() - .75) * (e.boss ? 480 : 320), dot: true, sz: 4 + Math.random() * 5, c: e.boss ? (i % 2 ? '#ff00dc' : '#111') : ['#7be36a', '#b6ff9e', '#4fbf45'][i % 3], t: now, life: 750 });
    fx.push({ x: e.x, y: e.y, ring: true, r: e.boss ? 120 : 46, c: e.boss ? '#ff7bf0' : '#e8ffe0', t: now, life: e.boss ? 600 : 350 });
    if (e.helpers > 1 && !e.boss) fx.push({ x: e.x, y: e.y - 40, text: `teamwork ×${e.helpers}`, c: '#ffd34d', t: now, life: 1100 });
    if (mine) { fx.push({ x: e.x, y: e.y - 20, text: e.boss ? '+6 XP' : '+1 XP', c: '#ffd34d', t: now + 120, life: 900, big: 0.9 }); shake(e.boss ? 14 : 4); sfx(e.boss ? 'boss' : 'kill'); stat('kills', 1); if (e.boss) stat('boss', 1); }
    else if (near(e)) sfx('kill', 0, 0.3);
  }
  else if (e.e === 'lvl' && e.id === myId) { sfx('lvl'); stat('lvl', 0, e.lvl); for (let i = 0; i < 30; i++) { const me = snapB.p.get(myId); if (me) fx.push({ x: me.x, y: me.y, vx: Math.cos(i / 30 * 6.28) * 200, vy: Math.sin(i / 30 * 6.28) * 200 - 80, dot: true, sz: 5, c: '#ffd34d', t: now, life: 800 }); } }
  if (e.e === 'lvl' && e.id === myId) toast(e.cap ? 'LEVEL 5 (MAX)' : 'LEVEL ' + e.lvl + '!', e.cap ? "That's every level they made." : ['Nothing new unlocked. The skill tree is a picture.', '+2 max HP. That was the whole budget.', 'Your armor is the same. It was always a texture.'][(e.lvl - 2) % 3]);
  else if (e.e === 'lvl') log(`${nameOf(e.id)} reached level ${e.lvl}.`, true);
  else if (e.e === 'fhit') {
    swings.set(e.by, now); fenceShake = now; const mine = e.by === myId;
    fx.push({ x: FENCE_X + (Math.random() - .5) * 16, y: e.y - 24, text: (e.crit ? 'CRIT ' : '') + '-' + e.dmg, c: e.crit ? '#ff9a3d' : mine ? '#fff' : '#ffe08a', t: now, life: 700, big: e.crit ? 1.5 : 1 });
    for (let i = 0; i < 4; i++) fx.push({ x: FENCE_X, y: e.y, vx: (Math.random() - .6) * 200, vy: (Math.random() - .8) * 180, dot: true, sz: 3 + Math.random() * 3, c: '#d9c39b', t: now, life: 500 });
    if (mine) { onMyHit(e); shake(e.crit ? 5 : 2); sfx('fence', e.combo); stat('fence', 1); }
  }
  else if (e.e === 'area2') {
    shake(e.open ? 10 : 5); sfx('fanfare');
    if (e.open) { toast('THE FENCE IS DOWN', 'AREA 2 is open for 3 minutes. Go! There is almost nothing there.'); for (let i = 0; i < 60; i++) fx.push({ x: FENCE_X, y: 60 + Math.random() * (H - 120), vx: (Math.random() - .3) * 300, vy: (Math.random() - .7) * 200, dot: true, c: '#d9c39b', t: now, life: 900 }); }
    else toast('FENCE REBUILT', 'The devs noticed. Everyone in Area 2 was sent back.');
  }
  else if (e.e === 'patch') { toast('PATCH ' + e.name + ' SHIPPED', e.note); sfx('fanfare'); }
  else if (e.e === 'die' && e.id === myId) { toast('YOU DIED', 'Respawning at the only spawn point.'); sfx('die'); shake(10); stat('deaths', 1); }
}
function log(text, sys, who, said) {
  const d = document.createElement('div');
  if (sys) { d.className = 'sys'; d.textContent = text; }
  else { const b = document.createElement('b'); b.textContent = who + ': '; d.append(b, said); }
  $('log').append(d);
  while ($('log').children.length > 5) $('log').firstChild.remove();
  setTimeout(() => { d.style.opacity = 0; }, 9000); setTimeout(() => d.remove(), 10000);
}
let toastT = 0;
function toast(big, small) { const t = $('toast'); t.innerHTML = ''; t.append(big); if (small) { const s = document.createElement('small'); s.textContent = small; t.append(s); } t.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => t.style.opacity = 0, 2600); }

// ---------- loot (your bag lives in this browser) ----------

  const cam = camera();
  const sx = (Math.random() - .5) * shakeAmt * 2, sy = (Math.random() - .5) * shakeAmt * 2; shakeAmt *= 0.86; if (shakeAmt < 0.3) shakeAmt = 0;
  cx.translate(-Math.round(cam.x) + sx, -Math.round(cam.y) + sy);
  if (now - comboAt > 2500 && comboN) { comboN = 0; $('combo').style.opacity = 0; }
  drawWorld(now);
  if (tapMark && now - tapMark.t < 500) { const k = (now - tapMark.t) / 500; cx.strokeStyle = tapMark.atk ? `rgba(255,80,80,${1 - k})` : `rgba(255,255,255,${1 - k})`; cx.lineWidth = 2; cx.beginPath(); cx.arc(tapMark.x, tapMark.y, 6 + 14 * k, 0, 7); cx.stroke(); }
  const me = interp('p', myId);
  const draw = [];
  if (snapB) {
    for (const id of snapB.m.keys()) { const s = interp('m', id); draw.push({ y: s.y, f: () => drawSlime(s, now) }); }
    // name tags: when players stand on top of each other, stack their labels so they never jumble
    const ps = [...snapB.p.keys()].map((id) => interp('p', id)).sort((a, b) => (b.id === myId) - (a.id === myId) || a.y - b.y || a.id - b.id);
    const placed = [];
    cx.font = '700 12px system-ui,sans-serif';
    for (const p of ps) {
      const w = cx.measureText(p.name + ' · ' + p.lvl).width + 6, th = p.look && p.look[3] > 0 ? 26 : 14;
      let y = p.y + 30;
      for (let tries = 0; tries < 12; tries++) {
        const hit = placed.find((r) => Math.abs(r.x - p.x) < (r.w + w) / 2 && y < r.y + r.h && r.y < y + th);
        if (!hit) break;
        y = hit.y + hit.h;
      }
      placed.push({ x: p.x, y, w, h: th }); p.tagX = p.x; p.tagY = y;
      draw.push({ y: p.y, f: () => drawPlayer(p, now), tag: p });
    }
  }
  draw.sort((a, b) => a.y - b.y).forEach((d) => d.f());
  for (const d of draw) if (d.tag) drawTag(d.tag);
  // speech
  if (snapB) for (const [id, b] of bubbles) { const p = interp('p', id); if (!p || now > b.until) { bubbles.delete(id); continue; } bubble(p.x, p.y - 40, b.text); }
  if (me) {
    if (Math.hypot(me.x - GUY.x, me.y - GUY.y) < 150) { if (now - guyAt > 4200) { guyAt = now; guyLine = (guyLine + 1) % GUY_LINES.length; } bubble(GUY.x, GUY.y - 30, GUY_LINES[guyLine], '#fff6c9'); }
    for (const s of SIGNS) if (Math.hypot(me.x - s.x, me.y - s.y) < 110) bubble(s.x, s.y - 30, s.title + ': ' + s.text, '#f6e3c0');
    for (let i = 0; i < Math.min(patch, PATCHES.length); i++) { const s = PATCHES[i]; if (Math.hypot(me.x - s.x, me.y - s.y) < 90) bubble(s.x, s.y - 44, s.title + ': ' + s.text, '#dcecff'); }
  }
  // floating numbers and bits
  for (let i = fx.length - 1; i >= 0; i--) {
    const f = fx[i], k = (now - f.t) / f.life; if (k >= 1) { fx.splice(i, 1); continue; }
    if (k < 0) continue;
    if (f.item != null) {
      // loot flying in an arc from the slime to you, spinning, then landing
      const me2 = interp('p', myId), tx = me2 ? me2.x : f.tx, ty = me2 ? me2.y - 40 : f.ty, e = k;
      const x = f.x + (tx - f.x) * e, y = f.y + (ty - f.y) * e - Math.sin(e * Math.PI) * 90;
      const it = ITEMS[f.item]; cx.save(); cx.translate(x, y); cx.rotate(e * 6.28 * (it.slot === 'hand' ? 1 : 0.3)); cx.scale(1.4, 1.4);
      cx.shadowColor = RARITY[it.r].color; cx.shadowBlur = 14;
      if (it.slot === 'hat') { cx.translate(0, 20); drawHat(cx, f.item, now); } else { cx.translate(0, 14); drawHand(cx, f.item); }
      cx.restore(); continue;
    }
    cx.globalAlpha = 1 - k;
    if (f.ring) { cx.strokeStyle = f.c; cx.lineWidth = 4 * (1 - k); cx.beginPath(); cx.arc(f.x, f.y, f.r * (0.3 + k), 0, 7); cx.stroke(); }
    else if (f.dot) { const t = (now - f.t) / 1000, z = f.sz || 6; cx.fillStyle = f.c; cx.fillRect(f.x + f.vx * t - z / 2, f.y + f.vy * t + 500 * t * t - z / 2, z, z); }
    else {
      const b = f.big || 1, pop = k < 0.15 ? 1 + (0.15 - k) * 4 : 1, sz = Math.round(15 * b * pop);
      cx.font = `900 ${sz}px system-ui,sans-serif`; cx.textAlign = 'center'; cx.lineWidth = 3 + b; cx.strokeStyle = 'rgba(0,0,0,.75)';
      const yy = f.y - k * 30 * b; cx.strokeText(f.text, f.x, yy); cx.fillStyle = f.c; cx.fillText(f.text, f.x, yy);
    }
    cx.globalAlpha = 1;
  }
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (now - redFlash < 220) { cx.fillStyle = `rgba(255,40,40,${0.25 * (1 - (now - redFlash) / 220)})`; cx.fillRect(0, 0, vw, vh); }
  requestAnimationFrame(frame);
}
connect();
requestAnimationFrame(frame);
}
